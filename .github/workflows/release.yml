name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
          - os: macos-14
            target: bun-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run verify:pins
      - run: bun run test
      - run: bun build --compile --minify --target=${{ matrix.target }} --outfile=dist/alab src/cli.ts
      - run: bun run test:binary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alab-${{ matrix.target }}
          path: dist/alab
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Package exact tested binaries
        run: |
          mkdir -p dist staging
          for artifact_dir in artifacts/alab-bun-*; do
            target="${artifact_dir##*/alab-bun-}"
            install -m 0755 "$artifact_dir/alab" staging/alab
            touch -d '@0' staging/alab
            tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner --mtime='@0' -C staging -cf - alab | gzip -n > "dist/alab-$target.tar.gz"
          done
          LC_ALL=C sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
