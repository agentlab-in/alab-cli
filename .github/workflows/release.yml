name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run verify:pins
      - run: bun test
      - run: bun run build:all
      - name: Package binaries
        run: |
          cd dist
          for binary in alab-*; do
            chmod +x "$binary"
            cp "$binary" alab
            tar -czf "$binary.tar.gz" alab
            rm alab
          done
          sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
